<nav
  class="app-navigation"
  aria-label="Primary navigation"
  data-web-app-url="<?= webAppUrl ?>"
>
  <div class="navigation-list">
    <? navigationItems.forEach(function (item) { ?>
      <a
        class="nav-link <?=
          currentRoute.key === item.key
            ? 'nav-link-active'
            : ''
        ?>"
        href="<?= webAppUrl ?>?page=<?=
          encodeURIComponent(item.key)
        ?>"
        data-app-route="<?= item.key ?>"
        target="_top"
        <? if (currentRoute.key === item.key) { ?>
          aria-current="page"
        <? } ?>
      >
        <?= item.title ?>
      </a>
    <? }); ?>
  </div>
</nav>
