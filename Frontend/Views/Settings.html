<section class="page-section" id="settings-workspace">
  <div class="page-header"><div><p class="eyebrow">Configuration</p><h1>Settings</h1>
    <p>Securely connect the services used by Project Savannah.</p></div></div>
  <article class="card">
    <h2>Creatomate video rendering</h2>
    <p id="creatomate-status">Checking connection…</p>
    <form id="creatomate-form" autocomplete="off">
      <label>API key<input id="creatomate-api-key" type="password" required autocomplete="new-password"
        placeholder="Stored securely in Apps Script properties"></label>
      <label>Template ID<input id="creatomate-template-id" type="text" required
        value="9157fd7e-ef01-4c63-bcf4-388e7282d779"></label>
      <button class="button button--primary" type="submit">Connect Creatomate</button>
    </form>
    <p id="creatomate-message" role="status"></p>
  </article>
  <article class="card">
    <h2>Shorts branding and narration</h2>
    <p>Reusable production defaults for every newly rendered Short.</p>
    <form id="production-branding-form">
      <label>Channel brand name
        <input id="production-brand-name" type="text" required maxlength="80" value="Savannah Atlas">
      </label>
      <label>Caption colour
        <input id="production-primary-color" type="color" value="#0f766e">
      </label>
      <label>Narration voice
        <select id="production-voice">
          <option value="alloy">Alloy</option>
          <option value="coral">Coral</option>
          <option value="echo">Echo</option>
          <option value="fable">Fable</option>
          <option value="nova">Nova</option>
          <option value="onyx">Onyx</option>
          <option value="sage">Sage</option>
          <option value="shimmer">Shimmer</option>
        </select>
      </label>
      <label>Speaking speed
        <input id="production-speech-speed" type="number" min="0.75" max="1.25" step="0.05" value="1">
      </label>
      <button class="button button--primary" type="submit">Save production style</button>
    </form>
    <p id="production-branding-message" role="status"></p>
  </article>
</section>
