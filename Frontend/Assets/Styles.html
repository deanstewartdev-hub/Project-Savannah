<style>
  :root {
    /* Brand */
    --color-brand-50: #eef8f2;
    --color-brand-100: #d8efe1;
    --color-brand-200: #b3dfc5;
    --color-brand-300: #82c69f;
    --color-brand-400: #4da978;
    --color-brand-500: #2f8b5b;
    --color-brand-600: #236f48;
    --color-brand-700: #1d593b;
    --color-brand-800: #194830;
    --color-brand-900: #153b29;

    /* Neutral */
    --color-background: #f4f7f5;
    --color-surface: #ffffff;
    --color-surface-muted: #f7f9f7;
    --color-border: #dce5de;
    --color-border-strong: #c6d2c9;

    --color-text-primary: #17231b;
    --color-text-secondary: #627067;
    --color-text-muted: #879189;
    --color-text-on-brand: #ffffff;

    /* Semantic */
    --color-info-background: #edf5ff;
    --color-info-text: #225b9b;
    --color-info-border: #c8ddf5;

    --color-success-background: #edf8f1;
    --color-success-text: #216e43;
    --color-success-border: #bfe1cc;

    --color-warning-background: #fff8e8;
    --color-warning-text: #8a5a10;
    --color-warning-border: #ecd39d;

    --color-danger-background: #fff0f0;
    --color-danger-text: #a13737;
    --color-danger-border: #efc2c2;

    /* Layout */
    --page-width: 1240px;
    --sidebar-width: 240px;

    /* Shape */
    --radius-small: 8px;
    --radius-medium: 12px;
    --radius-large: 18px;
    --radius-pill: 999px;

    /* Shadow */
    --shadow-small:
      0 1px 3px rgba(23, 35, 27, 0.06);

    --shadow-medium:
      0 10px 30px rgba(23, 35, 27, 0.08);

    /* Motion */
    --transition-fast: 150ms ease;
  }

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    min-height: 100%;
    background: var(--color-background);
  }

  body {
    min-height: 100vh;
    margin: 0;
    background: var(--color-background);
    color: var(--color-text-primary);
    font-family:
      Inter,
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Arial,
      sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  a {
    color: inherit;
  }

  /* Application shell */

  .app-shell {
    width: min(
      var(--page-width),
      calc(100% - 32px)
    );
    margin: 0 auto;
    padding: 28px 0 56px;
  }

  .app-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 22px;
  }

  .app-brand-group {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .app-logo {
    display: grid;
    width: 46px;
    height: 46px;
    place-items: center;
    border-radius: 14px;
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
    font-size: 22px;
    font-weight: 800;
    box-shadow: var(--shadow-small);
  }

  .app-eyebrow {
    margin: 0 0 4px;
    color: var(--color-brand-600);
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.14em;
  }

  .app-brand {
    margin: 0;
    font-size: clamp(25px, 4vw, 36px);
    line-height: 1.05;
  }

  .app-version {
    padding: 7px 11px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 700;
  }

  .app-navigation {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    margin-bottom: 24px;
    padding: 7px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .nav-link {
    flex: 0 0 auto;
    padding: 10px 15px;
    border-radius: 9px;
    color: var(--color-text-secondary);
    font-size: 14px;
    font-weight: 700;
    text-decoration: none;
    transition:
      background var(--transition-fast),
      color var(--transition-fast);
  }

  .nav-link:hover {
    background: var(--color-surface-muted);
    color: var(--color-text-primary);
  }

  .nav-link-active,
  .nav-link-active:hover {
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
  }

  .app-content {
    min-height: 540px;
  }

  /* Page structure */

  .page {
    display: grid;
    gap: 24px;
  }

  .page-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }

  .page-title {
    margin: 0 0 7px;
    font-size: clamp(26px, 4vw, 34px);
    line-height: 1.15;
  }

  .page-description {
    max-width: 720px;
    margin: 0;
    color: var(--color-text-secondary);
  }

  .page-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .section {
    display: grid;
    gap: 16px;
  }

  .section-header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
  }

  .section-title {
    margin: 0;
    font-size: 19px;
  }

  .section-description {
    margin: 4px 0 0;
    color: var(--color-text-secondary);
    font-size: 14px;
  }

  /* Layout grids */

  .grid {
    display: grid;
    gap: 16px;
  }

  .grid-2 {
    grid-template-columns:
      repeat(2, minmax(0, 1fr));
  }

  .grid-3 {
    grid-template-columns:
      repeat(3, minmax(0, 1fr));
  }

  .grid-4 {
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
  }

  /* Cards */

  .card {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .card-header {
    padding: 20px 22px 0;
  }

  .card-body {
    padding: 20px 22px;
  }

  .card-footer {
    padding: 0 22px 20px;
  }

  .card-title {
    margin: 0;
    font-size: 17px;
  }

  .card-description {
    margin: 5px 0 0;
    color: var(--color-text-secondary);
    font-size: 14px;
  }

  /* KPI cards */

  .kpi-card {
    padding: 20px;
  }

  .kpi-label {
    margin: 0 0 10px;
    color: var(--color-text-secondary);
    font-size: 13px;
    font-weight: 700;
  }

  .kpi-value {
    margin: 0;
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
  }

  .kpi-meta {
    margin: 10px 0 0;
    color: var(--color-text-muted);
    font-size: 13px;
  }

  /* Buttons */

  .button {
    display: inline-flex;
    min-height: 40px;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 9px 15px;
    border: 1px solid transparent;
    border-radius: var(--radius-small);
    cursor: pointer;
    font-weight: 700;
    text-decoration: none;
    transition:
      background var(--transition-fast),
      border-color var(--transition-fast),
      transform var(--transition-fast);
  }

  .button:hover {
    transform: translateY(-1px);
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
  }

  .button-primary {
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
  }

  .button-primary:hover {
    background: var(--color-brand-700);
  }

  .button-secondary {
    border-color: var(--color-border);
    background: var(--color-surface);
    color: var(--color-text-primary);
  }

  .button-secondary:hover {
    border-color: var(--color-border-strong);
    background: var(--color-surface-muted);
  }

  .button-danger {
    background: var(--color-danger-text);
    color: #ffffff;
  }

  .button-small {
    min-height: 34px;
    padding: 6px 11px;
    font-size: 13px;
  }

  /* Status badges */

  .badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    padding: 5px 9px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface-muted);
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: 800;
  }

  .badge-success {
    border-color: var(--color-success-border);
    background: var(--color-success-background);
    color: var(--color-success-text);
  }

  .badge-warning {
    border-color: var(--color-warning-border);
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  .badge-danger {
    border-color: var(--color-danger-border);
    background: var(--color-danger-background);
    color: var(--color-danger-text);
  }

  .badge-info {
    border-color: var(--color-info-border);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  /* Forms */

  .form-grid {
    display: grid;
    gap: 18px;
  }

  .form-group {
    display: grid;
    gap: 7px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 800;
  }

  .form-help {
    color: var(--color-text-muted);
    font-size: 12px;
  }

  .form-control {
    width: 100%;
    min-height: 42px;
    padding: 9px 12px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-small);
    outline: none;
    background: var(--color-surface);
    color: var(--color-text-primary);
    transition:
      border-color var(--transition-fast),
      box-shadow var(--transition-fast);
  }

  textarea.form-control {
    min-height: 120px;
    resize: vertical;
  }

  .form-control:focus {
    border-color: var(--color-brand-500);
    box-shadow:
      0 0 0 3px var(--color-brand-100);
  }

  /* Alerts */

  .alert {
    padding: 14px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
  }

  .alert-info {
    border-color: var(--color-info-border);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .alert-success {
    border-color: var(--color-success-border);
    background: var(--color-success-background);
    color: var(--color-success-text);
  }

  .alert-warning {
    border-color: var(--color-warning-border);
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  .alert-danger {
    border-color: var(--color-danger-border);
    background: var(--color-danger-background);
    color: var(--color-danger-text);
  }

  /* Tables */

  .table-container {
    overflow-x: auto;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
  }

  .table {
    width: 100%;
    border-collapse: collapse;
  }

  .table th,
  .table td {
    padding: 13px 15px;
    border-bottom: 1px solid var(--color-border);
    text-align: left;
    vertical-align: middle;
  }

  .table th {
    background: var(--color-surface-muted);
    color: var(--color-text-secondary);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .table tbody tr:last-child td {
    border-bottom: 0;
  }

  /* Utilities */

  .text-muted {
    color: var(--color-text-secondary);
  }

  .text-small {
    font-size: 13px;
  }

  .stack {
    display: grid;
    gap: 12px;
  }

  .divider {
    height: 1px;
    border: 0;
    background: var(--color-border);
  }

  /* Responsive */

  @media (max-width: 960px) {
    .grid-4 {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }

    .grid-3 {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 680px) {
    .app-shell {
      width: min(100% - 20px, var(--page-width));
      padding-top: 18px;
    }

    .app-header,
    .page-header,
    .section-header {
      align-items: flex-start;
      flex-direction: column;
    }

    .grid-2,
    .grid-3,
    .grid-4 {
      grid-template-columns: 1fr;
    }

    .page-actions {
      width: 100%;
    }

    .page-actions .button {
      flex: 1;
    }
  }
</style>
