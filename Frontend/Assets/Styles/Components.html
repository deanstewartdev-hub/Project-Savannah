<style>
  /* ==================================================
     Navigation links
     ================================================== */

  .nav-link {
    flex: 0 0 auto;
    padding: 10px 15px;
    border-radius: 9px;
    color: var(--color-text-secondary);
    font-size: var(--font-size-small);
    font-weight: var(--font-weight-bold);
    text-decoration: none;
    transition:
      background var(--transition-fast),
      color var(--transition-fast);
  }

  .nav-link:hover {
    background: var(--color-surface-muted);
    color: var(--color-text-primary);
  }

  .nav-link-active,
  .nav-link-active:hover {
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
  }

  /* ==================================================
     Cards
     ================================================== */

  .card {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .card-header {
    padding: 20px 22px 0;
  }

  .card-body {
    padding: 20px 22px;
  }

  .card-footer {
    padding: 0 22px 20px;
  }

  /* ==================================================
     Empty states — used throughout the app (Production,
     Analytics, SEO, notifications) whenever a list has
     nothing to show yet.
     ================================================== */

  .empty-state {
    display: grid;
    justify-items: center;
    gap: 8px;
    padding: 40px 24px;
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-large);
    background: var(--color-surface-muted);
    text-align: center;
  }

  .empty-state h3 {
    margin: 0;
    color: var(--color-text-primary);
    font-size: 15px;
    font-weight: var(--font-weight-bold);
  }

  .empty-state p {
    max-width: 420px;
    margin: 0;
    color: var(--color-text-secondary);
    font-size: 13px;
    line-height: 1.5;
  }

  .empty-state p:last-child {
    color: var(--color-text-secondary);
    font-size: 12px;
  }

  /* ==================================================
     Job / list cards — Production render jobs, ready-for-
     production items, and anywhere else that lists records
     as individual cards with a status + progress readout.
     ================================================== */

  .list-card {
    display: grid;
    gap: 12px;
    padding: 16px 18px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .list-card + .list-card {
    margin-top: 12px;
  }

  .list-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
  }

  .list-card-title {
    margin: 0;
    color: var(--color-text-primary);
    font-size: 15px;
    font-weight: var(--font-weight-bold);
  }

  .list-card-subtitle {
    margin: 4px 0 0;
    color: var(--color-text-secondary);
    font-size: 13px;
  }

  .list-card-body {
    display: grid;
    gap: 8px;
  }

  .list-card-meta {
    color: var(--color-text-secondary);
    font-size: 12px;
  }

  .list-card-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .progress-bar {
    height: 8px;
    border-radius: var(--radius-pill);
    background: var(--color-surface-muted);
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    border-radius: var(--radius-pill);
    background: var(--color-brand-500);
    transition: width 500ms ease;
  }

  .progress-bar[data-active="true"] .progress-bar-fill {
    background: linear-gradient(
      90deg,
      var(--color-brand-400),
      var(--color-brand-600),
      var(--color-brand-400)
    );
    background-size: 200% 100%;
    animation: progress-bar-shimmer 1.6s linear infinite;
  }

  @keyframes progress-bar-shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    .progress-bar[data-active="true"] .progress-bar-fill {
      animation: none;
    }
  }

  /* ==================================================
     KPI cards
     ================================================== */

  .kpi-card {
    padding: 20px;
  }

  /* ==================================================
     Generic stat-card grid — used by any workspace that shows
     a row of plain metric cards (Scripts, Queue, Production,
     Analytics, SEO) rather than the richer dashboard KPI treatment.
     ================================================== */

  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
  }

  @media (max-width: 1180px) {
    .dashboard-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 680px) {
    .dashboard-grid {
      grid-template-columns: 1fr;
    }
  }

  /* ==================================================
     Buttons
     ================================================== */

  .button {
    display: inline-flex;
    min-height: 40px;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: 9px 15px;
    border: 1px solid transparent;
    border-radius: var(--radius-small);
    cursor: pointer;
    font-weight: var(--font-weight-bold);
    text-decoration: none;
    transition:
      background var(--transition-fast),
      border-color var(--transition-fast),
      color var(--transition-fast),
      transform var(--transition-fast);
  }

  .button:hover {
    transform: translateY(-1px);
  }

  .button:focus-visible {
    outline: 3px solid var(--color-brand-200);
    outline-offset: 2px;
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
  }

  .button-primary {
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
  }

  .button-primary:hover {
    background: var(--color-brand-700);
  }

  .button-secondary {
    border-color: var(--color-border);
    background: var(--color-surface);
    color: var(--color-text-primary);
  }

  .button-secondary:hover {
    border-color: var(--color-border-strong);
    background: var(--color-surface-muted);
  }

  .button-danger {
    background: var(--color-danger-text);
    color: var(--color-text-on-brand);
  }

  .button-danger:hover {
    background: #842d2d;
  }

  .button-small {
    min-height: 34px;
    padding: 6px 11px;
    font-size: var(--font-size-label);
  }

  /* ==================================================
     Status badges
     ================================================== */

  .badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    padding: 5px 9px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface-muted);
    color: var(--color-text-secondary);
    font-size: var(--font-size-caption);
    font-weight: var(--font-weight-extra-bold);
  }

  .badge-success {
    border-color: var(--color-success-border);
    background: var(--color-success-background);
    color: var(--color-success-text);
  }

  .badge-warning {
    border-color: var(--color-warning-border);
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  .badge-danger {
    border-color: var(--color-danger-border);
    background: var(--color-danger-background);
    color: var(--color-danger-text);
  }

  .badge-info {
    border-color: var(--color-info-border);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  /* ==================================================
     Forms
     ================================================== */

  .form-grid {
    display: grid;
    gap: 18px;
  }

  .form-group {
    display: grid;
    gap: 7px;
  }

  .form-label {
    font-size: var(--font-size-label);
    font-weight: var(--font-weight-extra-bold);
  }

  .form-help {
    color: var(--color-text-secondary);
    font-size: var(--font-size-caption);
  }

  #queue-decision-reason-error {
    color: var(--color-danger-text);
  }

  .form-control {
    width: 100%;
    min-height: 42px;
    padding: 9px 12px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-small);
    outline: none;
    background: var(--color-surface);
    color: var(--color-text-primary);
    transition:
      border-color var(--transition-fast),
      box-shadow var(--transition-fast);
  }

  textarea.form-control {
    min-height: 120px;
    resize: vertical;
  }

  .form-control:focus {
    border-color: var(--color-brand-500);
    box-shadow:
      0 0 0 3px var(--color-brand-100);
  }

  .form-control:disabled {
    cursor: not-allowed;
    background: var(--color-surface-muted);
    color: var(--color-text-muted);
  }

  input[type="color"].form-control {
    width: 64px;
    min-height: 42px;
    padding: 4px;
  }

  /* ==================================================
     Alerts
     ================================================== */

  .alert {
    padding: 14px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
  }

  .alert-info {
    border-color: var(--color-info-border);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .alert-success {
    border-color: var(--color-success-border);
    background: var(--color-success-background);
    color: var(--color-success-text);
  }

  .alert-warning {
    border-color: var(--color-warning-border);
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  .alert-danger {
    border-color: var(--color-danger-border);
    background: var(--color-danger-background);
    color: var(--color-danger-text);
  }

  /* ==================================================
     Tables
     ================================================== */

  .table-container {
    overflow-x: auto;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
  }

  .table {
    width: 100%;
    border-collapse: collapse;
  }

  .table th,
  .table td {
    padding: 13px 15px;
    border-bottom: 1px solid var(--color-border);
    text-align: left;
    vertical-align: middle;
  }

  .table th {
    background: var(--color-surface-muted);
    color: var(--color-text-secondary);
    font-size: var(--font-size-caption);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .table tbody tr:last-child td {
    border-bottom: 0;
  }

  /* ==================================================
     Modal dialogs — Scripts detail review, Queue approval
     review. Shared chrome for the existing role="dialog"
     markup; open/close/focus behaviour lives in
     SavannahApp.modal.
     ================================================== */

  .modal {
    position: fixed;
    inset: 0;
    z-index: var(--z-index-modal);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--space-4);
  }

  .modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(23, 35, 27, 0.42);
  }

  .modal-dialog {
    position: relative;
    display: flex;
    flex-direction: column;
    width: min(560px, calc(100vw - 32px));
    max-height: min(calc(100vh - 64px), 720px);
    overflow-y: auto;
    overscroll-behavior: contain;
    border-radius: var(--radius-large);
    background: var(--color-surface);
    box-shadow: var(--shadow-large);
  }

  .modal-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
    padding: 20px 22px 0;
  }

  .modal-body {
    padding: 20px 22px;
  }

  .modal-title {
    margin: 0;
    font-size: var(--font-size-card-title);
    font-weight: var(--font-weight-bold);
  }

  body.modal-open .application-main {
    overflow: hidden;
  }

  @media (max-width: 900px) {
    body.modal-open {
      overflow: hidden;
    }
  }

  /* ==================================================
     Entrance animation — cards fade/slide in as they render,
     with a small stagger across the first several siblings.
     ================================================== */

  @keyframes fade-in-up {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: none;
    }
  }

  .card,
  .dashboard-kpi-card,
  .dashboard-total-card,
  .idea-workspace-card,
  .ideas-summary-card {
    animation: fade-in-up 480ms ease both;
  }

  .card:nth-of-type(1), .dashboard-kpi-card:nth-of-type(1), .dashboard-total-card:nth-of-type(1), .ideas-summary-card:nth-of-type(1) { animation-delay: 0ms; }
  .card:nth-of-type(2), .dashboard-kpi-card:nth-of-type(2), .dashboard-total-card:nth-of-type(2), .ideas-summary-card:nth-of-type(2) { animation-delay: 45ms; }
  .card:nth-of-type(3), .dashboard-kpi-card:nth-of-type(3), .dashboard-total-card:nth-of-type(3), .ideas-summary-card:nth-of-type(3) { animation-delay: 90ms; }
  .card:nth-of-type(4), .dashboard-kpi-card:nth-of-type(4), .dashboard-total-card:nth-of-type(4), .ideas-summary-card:nth-of-type(4) { animation-delay: 135ms; }
  .card:nth-of-type(5) { animation-delay: 180ms; }
  .card:nth-of-type(6) { animation-delay: 225ms; }

  @media (prefers-reduced-motion: reduce) {
    .card,
    .dashboard-kpi-card,
    .dashboard-total-card,
    .idea-workspace-card,
    .ideas-summary-card {
      animation: none;
    }
  }

  /* ==================================================
     Pipeline stepper — the "how far through the process"
     visual on the Dashboard. Built from the same pipeline
     data the old table used.
     ================================================== */

  .pipeline-stepper {
    display: flex;
    align-items: flex-start;
    gap: 0;
    padding: 22px 6px 6px;
  }

  .pipeline-step {
    display: flex;
    min-width: 92px;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    text-align: center;
  }

  .pipeline-step-icon {
    display: grid;
    width: 42px;
    height: 42px;
    flex: 0 0 42px;
    place-items: center;
    border: 2px solid var(--color-border);
    border-radius: 50%;
    background: var(--color-surface);
    color: var(--color-text-muted);
    transition:
      border-color var(--transition-normal),
      background var(--transition-normal),
      color var(--transition-normal),
      transform var(--transition-normal);
  }

  .pipeline-step-icon svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  .pipeline-step[data-status="active"] .pipeline-step-icon {
    border-color: var(--color-brand-600);
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
    box-shadow: 0 0 0 5px var(--color-brand-50);
  }

  .pipeline-step[data-status="review_required"] .pipeline-step-icon {
    border-color: var(--color-info-text);
    background: var(--color-info-background);
    color: var(--color-info-text);
    animation: pipeline-pulse 1.8s ease-in-out infinite;
  }

  .pipeline-step[data-status="building"] .pipeline-step-icon {
    border-color: var(--color-warning-text);
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  @keyframes pipeline-pulse {
    0%, 100% { box-shadow: 0 0 0 0 var(--color-info-border); }
    50% { box-shadow: 0 0 0 6px transparent; }
  }

  .pipeline-step-name {
    color: var(--color-text-primary);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
  }

  .pipeline-step-count {
    padding: 2px 8px;
    border-radius: var(--radius-pill);
    background: var(--color-surface-muted);
    color: var(--color-text-secondary);
    font-size: 11px;
    font-weight: var(--font-weight-extra-bold);
  }

  .pipeline-step[data-status="active"] .pipeline-step-count {
    background: var(--color-brand-50);
    color: var(--color-brand-700);
  }

  .pipeline-connector {
    position: relative;
    top: 20px;
    height: 2px;
    flex: 1 1 auto;
    min-width: 16px;
    margin: 0 -2px;
    background: var(--color-border);
    overflow: hidden;
  }

  .pipeline-connector-fill {
    position: absolute;
    inset: 0;
    width: 0;
    background: var(--color-brand-500);
    transition: width var(--transition-slow) 120ms;
  }

  .pipeline-connector[data-filled="true"] .pipeline-connector-fill {
    width: 100%;
  }

  @media (max-width: 900px) {
    .pipeline-stepper {
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
    }

    .pipeline-step {
      flex-direction: row;
      min-width: 0;
      justify-content: flex-start;
      text-align: left;
    }

    .pipeline-connector {
      top: 0;
      width: 2px;
      height: 20px;
      margin: 0 0 0 20px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .pipeline-step[data-status="review_required"] .pipeline-step-icon {
      animation: none;
    }
  }

  /* ==================================================
     Accessible interactive states
     ================================================== */

  .nav-link:focus-visible,
  .form-control:focus-visible,
  a:focus-visible {
    outline: 3px solid var(--color-brand-200);
    outline-offset: 2px;
  }

    /* ==================================================
     Sidebar navigation
     ================================================== */

  .sidebar-nav-link {
    display: flex;
    min-height: 42px;
    align-items: center;
    gap: 11px;
    padding: 9px 11px;
    border-radius: 9px;
    color: var(--color-text-secondary);
    font-size: 13px;
    font-weight: var(--font-weight-bold);
    text-decoration: none;
    transition:
      background var(--transition-fast),
      color var(--transition-fast),
      transform var(--transition-fast);
  }

  .sidebar-nav-link:hover {
    background: var(--color-surface-muted);
    color: var(--color-text-primary);
    transform: translateX(2px);
  }

  .sidebar-nav-link-active,
  .sidebar-nav-link-active:hover {
    background: var(--color-brand-50);
    color: var(--color-brand-700);
  }

  .sidebar-nav-link-active {
    box-shadow:
      inset 3px 0 0 var(--color-brand-600);
  }

  .sidebar-nav-icon {
    display: grid;
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    place-items: center;
  }

  .sidebar-nav-icon svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  .sidebar-nav-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sidebar-nav-link:focus-visible,
  .sidebar-brand-link:focus-visible,
  .sidebar-account:focus-visible,
  .topbar-icon-button:focus-visible,
  .topbar-profile:focus-visible,
  .sidebar-close-button:focus-visible {
    outline: 3px solid var(--color-brand-200);
    outline-offset: 2px;
  }

    /* ==================================================
     Dashboard page
     ================================================== */

  .dashboard-page {
    gap: 30px;
  }

  /* ==================================================
     Dashboard hero
     ================================================== */

  .dashboard-hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-5);
    padding: 4px 0;
  }

  .dashboard-hero-content {
    display: grid;
    gap: 14px;
  }

  .dashboard-hero-heading {
    display: grid;
    gap: 5px;
  }

  .dashboard-hero-eyebrow,
  .section-eyebrow {
    margin: 0;
    color: var(--color-brand-600);
    font-size: 11px;
    font-weight: var(--font-weight-extra-bold);
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .dashboard-hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .button-icon {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  /* ==================================================
     Dashboard data states
     ================================================== */

  .dashboard-data-message {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px 16px;
    border: 1px solid var(--color-info-border);
    border-radius: var(--radius-medium);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .dashboard-data-message strong {
    display: block;
    font-size: 13px;
  }

  .dashboard-data-message p {
    margin: 2px 0 0;
    font-size: 12px;
  }

  .dashboard-loading-spinner {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border: 2px solid var(--color-info-border);
    border-top-color: var(--color-info-text);
    border-radius: 50%;
    animation:
      dashboard-spin
      750ms
      linear
      infinite;
  }

  @keyframes dashboard-spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ==================================================
     Dashboard KPI cards
     ================================================== */

  .dashboard-date-label {
    padding: 6px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
  }

  .dashboard-kpi-grid {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .dashboard-kpi-card {
    position: relative;
    display: grid;
    min-width: 0;
    min-height: 180px;
    grid-template-rows:
      auto
      1fr
      auto;
    overflow: hidden;
    padding: 18px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background:
      linear-gradient(
        145deg,
        var(--color-surface),
        var(--color-surface-muted)
      );
    box-shadow: var(--shadow-small);
    transition:
      border-color var(--transition-fast),
      box-shadow var(--transition-fast),
      transform var(--transition-fast);
  }

  .dashboard-kpi-card:hover {
    border-color: var(--color-border-strong);
    box-shadow: var(--shadow-medium);
    transform: translateY(-2px);
  }

  .dashboard-kpi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .dashboard-kpi-icon {
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border-radius: 11px;
  }

  .dashboard-kpi-icon svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  .dashboard-kpi-icon-ideas {
    background: #fff8e8;
    color: #8a5a10;
  }

  .dashboard-kpi-icon-scripts {
    background: #edf5ff;
    color: #225b9b;
  }

  .dashboard-kpi-icon-approval {
    background: #edf8f1;
    color: #216e43;
  }

  .dashboard-kpi-icon-cost {
    background: var(--color-accent-violet-background);
    color: var(--color-accent-violet-text);
  }

  .dashboard-kpi-status {
    padding: 4px 8px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--color-text-secondary);
    font-size: 10px;
    font-weight: var(--font-weight-extra-bold);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .dashboard-kpi-content {
    align-self: end;
    padding: 18px 0 12px;
  }

  .dashboard-kpi-content .kpi-label {
    margin-bottom: 8px;
  }

  .dashboard-cost-value {
    font-size: 28px;
  }

  .dashboard-kpi-accent {
    width: 42px;
    height: 4px;
    border-radius: var(--radius-pill);
    background: var(--color-brand-500);
  }

  /* ==================================================
     Dashboard panels
     ================================================== */

  .dashboard-primary-grid {
    display: grid;
    grid-template-columns:
      minmax(0, 1.05fr)
      minmax(0, 0.95fr);
    gap: var(--space-4);
  }

  .dashboard-panel {
    min-width: 0;
    overflow: hidden;
  }

  .dashboard-panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
    padding: 20px 20px 17px;
    border-bottom: 1px solid var(--color-border);
  }

  .dashboard-panel-header > div {
    display: grid;
    gap: 4px;
  }

  .dashboard-panel-body {
    padding: 18px 20px 20px;
  }

  .dashboard-panel-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--color-brand-700);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
    text-decoration: none;
  }

  .dashboard-panel-link:hover {
    color: var(--color-brand-800);
  }

  .dashboard-panel-link svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  .dashboard-table-container {
    border-radius: 10px;
    box-shadow: none;
  }

  .dashboard-table th:last-child,
  .dashboard-table td:last-child {
    text-align: right;
  }

  /* ==================================================
     Recent activity
     ================================================== */

  .dashboard-live-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border: 1px solid var(--color-success-border);
    border-radius: var(--radius-pill);
    background: var(--color-success-background);
    color: var(--color-success-text);
    font-size: 10px;
    font-weight: var(--font-weight-extra-bold);
    text-transform: uppercase;
  }

  .dashboard-live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-success-text);
  }

  .dashboard-activity-list {
    display: grid;
    max-height: 360px;
    gap: 10px;
    overflow-y: auto;
    padding: 18px 20px 20px;
  }

  .dashboard-activity-list > .card {
    border-radius: var(--radius-medium);
    box-shadow: none;
  }

  .dashboard-activity-list
    > .card
    .card-body {
    padding: 14px;
  }

  .dashboard-activity-loading {
    padding: 16px;
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-medium);
    color: var(--color-text-secondary);
    font-size: 13px;
    text-align: center;
  }

  /* ==================================================
     Dashboard lifetime totals
     ================================================== */

  .dashboard-total-grid {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .dashboard-total-card {
    display: grid;
    gap: 6px;
    padding: 18px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .dashboard-total-label {
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
  }

  .dashboard-total-card strong {
    color: var(--color-text-primary);
    font-size: 27px;
    line-height: 1.1;
  }

  .dashboard-total-meta {
    color: var(--color-text-secondary);
    font-size: 11px;
  }

  /* ==================================================
     Dashboard responsive behaviour
     ================================================== */

  @media (max-width: 1180px) {
    .dashboard-kpi-grid,
    .dashboard-total-grid {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 900px) {
    .dashboard-primary-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 680px) {
    .dashboard-page {
      gap: 24px;
    }

    .dashboard-hero {
      flex-direction: column;
    }

    .dashboard-hero-actions {
      width: 100%;
    }

    .dashboard-hero-actions .button {
      flex: 1;
    }

    .dashboard-kpi-grid,
    .dashboard-total-grid {
      grid-template-columns: 1fr;
    }

    .dashboard-kpi-card {
      min-height: 165px;
    }

    .dashboard-panel-header {
      flex-direction: column;
    }
  }

    /* ==================================================
     Ideas workspace
     ================================================== */

  .ideas-page {
    gap: 26px;
  }

  /* ==================================================
     Ideas hero
     ================================================== */

  .ideas-hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-5);
  }

  .ideas-hero-content {
    display: grid;
    gap: 5px;
  }

  .ideas-hero-eyebrow {
    margin: 0 0 2px;
    color: var(--color-brand-600);
    font-size: 11px;
    font-weight: var(--font-weight-extra-bold);
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .ideas-hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* ==================================================
     Generation status
     ================================================== */

  .ideas-status-banner {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px 17px;
    border: 1px solid var(--color-info-border);
    border-radius: var(--radius-medium);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .ideas-status-banner strong {
    display: block;
    font-size: 13px;
  }

  .ideas-status-banner p {
    margin: 3px 0 0;
    font-size: 12px;
  }

  .ideas-status-spinner {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border: 2px solid var(--color-info-border);
    border-top-color: var(--color-info-text);
    border-radius: 50%;
    animation:
      ideas-spinner-rotation
      750ms
      linear
      infinite;
  }

  @keyframes ideas-spinner-rotation {
    to {
      transform: rotate(360deg);
    }
  }

  /* ==================================================
     Summary cards
     ================================================== */

  .ideas-summary-grid {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .ideas-summary-card {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 13px;
    padding: 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .ideas-summary-icon {
    display: grid;
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    place-items: center;
    border-radius: 11px;
  }

  .ideas-summary-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  .ideas-summary-icon-all {
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  .ideas-summary-icon-review {
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .ideas-summary-icon-approved {
    background: var(--color-success-background);
    color: var(--color-success-text);
  }

  .ideas-summary-icon-scripts {
    background: var(--color-accent-violet-background);
    color: var(--color-accent-violet-text);
  }

  .ideas-summary-card > div {
    display: grid;
    min-width: 0;
    gap: 2px;
  }

  .ideas-summary-label {
    overflow: hidden;
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ideas-summary-card strong {
    color: var(--color-text-primary);
    font-size: 24px;
    line-height: 1.2;
  }

  /* ==================================================
     Ideas toolbar
     ================================================== */

  .ideas-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .ideas-search {
    display: flex;
    min-width: 220px;
    min-height: 40px;
    flex: 1;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-small);
    background: var(--color-surface-muted);
  }

  .ideas-search svg {
    width: 17px;
    height: 17px;
    flex: 0 0 17px;
    fill: none;
    stroke: var(--color-text-muted);
    stroke-linecap: round;
    stroke-width: 2;
  }

  .ideas-search input {
    min-width: 0;
    flex: 1;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--color-text-primary);
    font-size: 13px;
  }

  .ideas-filter-group {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-small);
    background: var(--color-surface-muted);
  }

  .ideas-filter-button {
    min-height: 32px;
    padding: 6px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--color-text-secondary);
    cursor: pointer;
    font-size: 12px;
    font-weight: var(--font-weight-bold);
  }

  .ideas-filter-button:hover {
    color: var(--color-text-primary);
  }

  .ideas-filter-button-active {
    background: var(--color-surface);
    color: var(--color-brand-700);
    box-shadow: var(--shadow-small);
  }

  .ideas-view-actions {
    display: flex;
    gap: 4px;
  }

  .ideas-view-button {
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-small);
    background: var(--color-surface);
    color: var(--color-text-muted);
    cursor: pointer;
  }

  .ideas-view-button:hover,
  .ideas-view-button-active {
    border-color: var(--color-brand-200);
    background: var(--color-brand-50);
    color: var(--color-brand-700);
  }

  .ideas-view-button svg {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  /* ==================================================
     Ideas board
     ================================================== */

  .ideas-board {
    display: grid;
    grid-template-columns:
      repeat(3, minmax(270px, 1fr));
    gap: var(--space-4);
    align-items: start;
  }

  .ideas-board-column {
    min-width: 0;
    padding: 15px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background: var(--color-surface-muted);
  }

  .ideas-board-column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .ideas-board-column-header > div {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .ideas-board-column-header h3 {
    margin: 0;
    font-size: 14px;
  }

  .ideas-column-indicator {
    width: 8px;
    height: 8px;
    flex: 0 0 8px;
    border-radius: 50%;
  }

  .ideas-column-indicator-review {
    background: var(--color-info-text);
  }

  .ideas-column-indicator-approved {
    background: var(--color-success-text);
  }

  .ideas-column-indicator-script {
    background: var(--color-accent-violet-text);
  }

  .ideas-column-count {
    display: grid;
    min-width: 25px;
    height: 25px;
    place-items: center;
    padding: 0 7px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--color-text-secondary);
    font-size: 11px;
    font-weight: var(--font-weight-extra-bold);
  }

  .ideas-board-column-description {
    margin: 8px 0 14px;
    color: var(--color-text-secondary);
    font-size: 11px;
    line-height: 1.5;
  }

  .ideas-column-list {
    display: grid;
    gap: 10px;
  }

  /* ==================================================
     Idea cards
     ================================================== */

  .idea-workspace-card {
    display: grid;
    gap: 12px;
    padding: 14px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
    transition:
      border-color var(--transition-fast),
      box-shadow var(--transition-fast),
      transform var(--transition-fast);
  }

  .idea-workspace-card:hover {
    border-color: var(--color-border-strong);
    box-shadow: var(--shadow-medium);
    transform: translateY(-1px);
  }

  .idea-workspace-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
  }

  .idea-workspace-card-category {
    padding: 4px 8px;
    border-radius: var(--radius-pill);
    background: var(--color-brand-50);
    color: var(--color-brand-700);
    font-size: 10px;
    font-weight: var(--font-weight-extra-bold);
    text-transform: uppercase;
  }

  .idea-workspace-card-menu {
    display: grid;
    width: 30px;
    height: 30px;
    place-items: center;
    border: 0;
    border-radius: 7px;
    background: transparent;
    color: var(--color-text-muted);
    cursor: pointer;
  }

  .idea-workspace-card-menu:hover {
    background: var(--color-surface-muted);
    color: var(--color-text-primary);
  }

  .idea-workspace-card-menu svg {
    width: 16px;
    height: 16px;
    fill: currentColor;
  }

  .idea-workspace-card h4 {
    margin: 0;
    color: var(--color-text-primary);
    font-size: 14px;
    line-height: 1.4;
  }

  .idea-workspace-card-description {
    margin: -4px 0 0;
    color: var(--color-text-secondary);
    font-size: 12px;
    line-height: 1.5;
  }

  .idea-workspace-card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .idea-workspace-card-stat {
    padding: 4px 7px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface-muted);
    color: var(--color-text-secondary);
    font-size: 10px;
    font-weight: var(--font-weight-bold);
  }

  .idea-workspace-card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 10px;
    border-top: 1px solid var(--color-border);
  }

  .idea-workspace-card-date {
    color: var(--color-text-secondary);
    font-size: 10px;
  }

  .idea-workspace-card-actions {
    display: flex;
    gap: 6px;
  }

  .idea-card-action {
    min-height: 30px;
    padding: 5px 8px;
    border: 1px solid var(--color-border);
    border-radius: 7px;
    background: var(--color-surface);
    color: var(--color-text-secondary);
    cursor: pointer;
    font-size: 10px;
    font-weight: var(--font-weight-bold);
  }

  .idea-card-action:hover {
    border-color: var(--color-border-strong);
    background: var(--color-surface-muted);
    color: var(--color-text-primary);
  }

  .idea-card-action-primary {
    border-color: var(--color-brand-600);
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
  }

  .idea-card-action-primary:hover {
    border-color: var(--color-brand-700);
    background: var(--color-brand-700);
    color: var(--color-text-on-brand);
  }

  /* ==================================================
     Board column states
     ================================================== */

  .ideas-column-loading,
  .ideas-column-empty {
    display: grid;
    justify-items: center;
    gap: 6px;
    padding: 28px 14px;
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-medium);
    color: var(--color-text-secondary);
    font-size: 12px;
    text-align: center;
  }

  .ideas-column-empty strong {
    color: var(--color-text-secondary);
    font-size: 12px;
  }

  .ideas-column-empty p {
    margin: 0;
    font-size: 11px;
  }

  .ideas-column-empty-icon {
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border-radius: 50%;
    background: var(--color-surface);
    color: var(--color-text-muted);
  }

  .ideas-column-empty-icon svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  /* ==================================================
     Main empty state
     ================================================== */

  .ideas-empty-state {
    display: grid;
    justify-items: center;
    gap: 10px;
    padding: 54px 24px;
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-large);
    background: var(--color-surface);
    text-align: center;
  }

  .ideas-empty-state-icon {
    display: grid;
    width: 58px;
    height: 58px;
    place-items: center;
    border-radius: 16px;
    background: var(--color-brand-50);
    color: var(--color-brand-700);
  }

  .ideas-empty-state-icon svg {
    width: 28px;
    height: 28px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  .ideas-empty-state h3 {
    margin: 6px 0 0;
    font-size: 18px;
  }

  .ideas-empty-state p {
    max-width: 460px;
    margin: 0 0 4px;
    color: var(--color-text-secondary);
    font-size: 13px;
  }

  /* ==================================================
     Ideas accessibility states
     ================================================== */

  .ideas-filter-button:focus-visible,
  .ideas-view-button:focus-visible,
  .idea-workspace-card-menu:focus-visible,
  .idea-card-action:focus-visible {
    outline: 3px solid var(--color-brand-200);
    outline-offset: 2px;
  }

  /* ==================================================
     Ideas responsive behaviour
     ================================================== */

  @media (max-width: 1180px) {
    .ideas-summary-grid {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }

    .ideas-board {
      overflow-x: auto;
      grid-template-columns:
        repeat(3, minmax(290px, 1fr));
      padding-bottom: 6px;
    }
  }

  @media (max-width: 900px) {
    .ideas-toolbar {
      align-items: stretch;
      flex-wrap: wrap;
    }

    .ideas-search {
      width: 100%;
      flex-basis: 100%;
    }

    .ideas-filter-group {
      flex: 1;
      overflow-x: auto;
    }
  }

  @media (max-width: 680px) {
    .ideas-page {
      gap: 22px;
    }

    .ideas-hero {
      flex-direction: column;
    }

    .ideas-hero-actions {
      width: 100%;
    }

    .ideas-hero-actions .button {
      flex: 1;
    }

    .ideas-summary-grid {
      grid-template-columns: 1fr;
    }

    .ideas-filter-group {
      width: 100%;
      flex-basis: 100%;
    }

    .ideas-filter-button {
      flex: 1 0 auto;
    }

    .ideas-view-actions {
      margin-left: auto;
    }
  }
  /* ==================================================
     Analytics charts
     ================================================== */

  .analytics-chart-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: var(--space-5);
  }

  .analytics-chart-card { min-width: 0; }

  .analytics-chart {
    min-height: 220px;
    display: grid;
    align-items: center;
    color: var(--color-text-secondary);
  }

  .analytics-chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .analytics-chart__grid { stroke: var(--color-border); stroke-width: 1; }
  .analytics-chart__line {
    fill: none;
    stroke: var(--color-brand-600);
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 4;
  }
