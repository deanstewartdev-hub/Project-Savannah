<style>
  /* ==================================================
     Navigation links
     ================================================== */

  .nav-link {
    flex: 0 0 auto;
    padding: 10px 15px;
    border-radius: 9px;
    color: var(--color-text-secondary);
    font-size: var(--font-size-small);
    font-weight: var(--font-weight-bold);
    text-decoration: none;
    transition:
      background var(--transition-fast),
      color var(--transition-fast);
  }

  .nav-link:hover {
    background: var(--color-surface-muted);
    color: var(--color-text-primary);
  }

  .nav-link-active,
  .nav-link-active:hover {
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
  }

  /* ==================================================
     Cards
     ================================================== */

  .card {
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .card-header {
    padding: 20px 22px 0;
  }

  .card-body {
    padding: 20px 22px;
  }

  .card-footer {
    padding: 0 22px 20px;
  }

  /* ==================================================
     KPI cards
     ================================================== */

  .kpi-card {
    padding: 20px;
  }

  /* ==================================================
     Buttons
     ================================================== */

  .button {
    display: inline-flex;
    min-height: 40px;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    padding: 9px 15px;
    border: 1px solid transparent;
    border-radius: var(--radius-small);
    cursor: pointer;
    font-weight: var(--font-weight-bold);
    text-decoration: none;
    transition:
      background var(--transition-fast),
      border-color var(--transition-fast),
      color var(--transition-fast),
      transform var(--transition-fast);
  }

  .button:hover {
    transform: translateY(-1px);
  }

  .button:focus-visible {
    outline: 3px solid var(--color-brand-200);
    outline-offset: 2px;
  }

  .button:disabled {
    cursor: not-allowed;
    opacity: 0.55;
    transform: none;
  }

  .button-primary {
    background: var(--color-brand-600);
    color: var(--color-text-on-brand);
  }

  .button-primary:hover {
    background: var(--color-brand-700);
  }

  .button-secondary {
    border-color: var(--color-border);
    background: var(--color-surface);
    color: var(--color-text-primary);
  }

  .button-secondary:hover {
    border-color: var(--color-border-strong);
    background: var(--color-surface-muted);
  }

  .button-danger {
    background: var(--color-danger-text);
    color: var(--color-text-on-brand);
  }

  .button-danger:hover {
    background: #842d2d;
  }

  .button-small {
    min-height: 34px;
    padding: 6px 11px;
    font-size: var(--font-size-label);
  }

  /* ==================================================
     Status badges
     ================================================== */

  .badge {
    display: inline-flex;
    align-items: center;
    width: fit-content;
    padding: 5px 9px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface-muted);
    color: var(--color-text-secondary);
    font-size: var(--font-size-caption);
    font-weight: var(--font-weight-extra-bold);
  }

  .badge-success {
    border-color: var(--color-success-border);
    background: var(--color-success-background);
    color: var(--color-success-text);
  }

  .badge-warning {
    border-color: var(--color-warning-border);
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  .badge-danger {
    border-color: var(--color-danger-border);
    background: var(--color-danger-background);
    color: var(--color-danger-text);
  }

  .badge-info {
    border-color: var(--color-info-border);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  /* ==================================================
     Forms
     ================================================== */

  .form-grid {
    display: grid;
    gap: 18px;
  }

  .form-group {
    display: grid;
    gap: 7px;
  }

  .form-label {
    font-size: var(--font-size-label);
    font-weight: var(--font-weight-extra-bold);
  }

  .form-help {
    color: var(--color-text-muted);
    font-size: var(--font-size-caption);
  }

  .form-control {
    width: 100%;
    min-height: 42px;
    padding: 9px 12px;
    border: 1px solid var(--color-border-strong);
    border-radius: var(--radius-small);
    outline: none;
    background: var(--color-surface);
    color: var(--color-text-primary);
    transition:
      border-color var(--transition-fast),
      box-shadow var(--transition-fast);
  }

  textarea.form-control {
    min-height: 120px;
    resize: vertical;
  }

  .form-control:focus {
    border-color: var(--color-brand-500);
    box-shadow:
      0 0 0 3px var(--color-brand-100);
  }

  .form-control:disabled {
    cursor: not-allowed;
    background: var(--color-surface-muted);
    color: var(--color-text-muted);
  }

  /* ==================================================
     Alerts
     ================================================== */

  .alert {
    padding: 14px 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
  }

  .alert-info {
    border-color: var(--color-info-border);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .alert-success {
    border-color: var(--color-success-border);
    background: var(--color-success-background);
    color: var(--color-success-text);
  }

  .alert-warning {
    border-color: var(--color-warning-border);
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  .alert-danger {
    border-color: var(--color-danger-border);
    background: var(--color-danger-background);
    color: var(--color-danger-text);
  }

  /* ==================================================
     Tables
     ================================================== */

  .table-container {
    overflow-x: auto;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
  }

  .table {
    width: 100%;
    border-collapse: collapse;
  }

  .table th,
  .table td {
    padding: 13px 15px;
    border-bottom: 1px solid var(--color-border);
    text-align: left;
    vertical-align: middle;
  }

  .table th {
    background: var(--color-surface-muted);
    color: var(--color-text-secondary);
    font-size: var(--font-size-caption);
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .table tbody tr:last-child td {
    border-bottom: 0;
  }

  /* ==================================================
     Accessible interactive states
     ================================================== */

  .nav-link:focus-visible,
  .form-control:focus-visible,
  a:focus-visible {
    outline: 3px solid var(--color-brand-200);
    outline-offset: 2px;
  }

    /* ==================================================
     Sidebar navigation
     ================================================== */

  .sidebar-nav-link {
    display: flex;
    min-height: 42px;
    align-items: center;
    gap: 11px;
    padding: 9px 11px;
    border-radius: 9px;
    color: var(--color-text-secondary);
    font-size: 13px;
    font-weight: var(--font-weight-bold);
    text-decoration: none;
    transition:
      background var(--transition-fast),
      color var(--transition-fast),
      transform var(--transition-fast);
  }

  .sidebar-nav-link:hover {
    background: var(--color-surface-muted);
    color: var(--color-text-primary);
    transform: translateX(2px);
  }

  .sidebar-nav-link-active,
  .sidebar-nav-link-active:hover {
    background: var(--color-brand-50);
    color: var(--color-brand-700);
  }

  .sidebar-nav-link-active {
    box-shadow:
      inset 3px 0 0 var(--color-brand-600);
  }

  .sidebar-nav-icon {
    display: grid;
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    place-items: center;
  }

  .sidebar-nav-icon svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  .sidebar-nav-label {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .sidebar-nav-link:focus-visible,
  .sidebar-brand-link:focus-visible,
  .sidebar-account:focus-visible,
  .topbar-icon-button:focus-visible,
  .topbar-profile:focus-visible,
  .sidebar-close-button:focus-visible {
    outline: 3px solid var(--color-brand-200);
    outline-offset: 2px;
  }

    /* ==================================================
     Dashboard page
     ================================================== */

  .dashboard-page {
    gap: 30px;
  }

  /* ==================================================
     Dashboard hero
     ================================================== */

  .dashboard-hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-5);
    padding: 4px 0;
  }

  .dashboard-hero-content {
    display: grid;
    gap: 14px;
  }

  .dashboard-hero-heading {
    display: grid;
    gap: 5px;
  }

  .dashboard-hero-eyebrow,
  .section-eyebrow {
    margin: 0;
    color: var(--color-brand-600);
    font-size: 11px;
    font-weight: var(--font-weight-extra-bold);
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .dashboard-hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  .button-icon {
    width: 17px;
    height: 17px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  /* ==================================================
     Dashboard data states
     ================================================== */

  .dashboard-data-message {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 14px 16px;
    border: 1px solid var(--color-info-border);
    border-radius: var(--radius-medium);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .dashboard-data-message strong {
    display: block;
    font-size: 13px;
  }

  .dashboard-data-message p {
    margin: 2px 0 0;
    font-size: 12px;
  }

  .dashboard-loading-spinner {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border: 2px solid var(--color-info-border);
    border-top-color: var(--color-info-text);
    border-radius: 50%;
    animation:
      dashboard-spin
      750ms
      linear
      infinite;
  }

  @keyframes dashboard-spin {
    to {
      transform: rotate(360deg);
    }
  }

  /* ==================================================
     Dashboard KPI cards
     ================================================== */

  .dashboard-date-label {
    padding: 6px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
  }

  .dashboard-kpi-grid {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .dashboard-kpi-card {
    position: relative;
    display: grid;
    min-width: 0;
    min-height: 180px;
    grid-template-rows:
      auto
      1fr
      auto;
    overflow: hidden;
    padding: 18px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-large);
    background:
      linear-gradient(
        145deg,
        var(--color-surface),
        var(--color-surface-muted)
      );
    box-shadow: var(--shadow-small);
    transition:
      border-color var(--transition-fast),
      box-shadow var(--transition-fast),
      transform var(--transition-fast);
  }

  .dashboard-kpi-card:hover {
    border-color: var(--color-border-strong);
    box-shadow: var(--shadow-medium);
    transform: translateY(-2px);
  }

  .dashboard-kpi-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }

  .dashboard-kpi-icon {
    display: grid;
    width: 38px;
    height: 38px;
    place-items: center;
    border-radius: 11px;
  }

  .dashboard-kpi-icon svg {
    width: 19px;
    height: 19px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  .dashboard-kpi-icon-ideas {
    background: #fff8e8;
    color: #8a5a10;
  }

  .dashboard-kpi-icon-scripts {
    background: #edf5ff;
    color: #225b9b;
  }

  .dashboard-kpi-icon-approval {
    background: #edf8f1;
    color: #216e43;
  }

  .dashboard-kpi-icon-cost {
    background: #f3efff;
    color: #6542a6;
  }

  .dashboard-kpi-status {
    padding: 4px 8px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-pill);
    background: var(--color-surface);
    color: var(--color-text-muted);
    font-size: 10px;
    font-weight: var(--font-weight-extra-bold);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  .dashboard-kpi-content {
    align-self: end;
    padding: 18px 0 12px;
  }

  .dashboard-kpi-content .kpi-label {
    margin-bottom: 8px;
  }

  .dashboard-cost-value {
    font-size: 28px;
  }

  .dashboard-kpi-accent {
    width: 42px;
    height: 4px;
    border-radius: var(--radius-pill);
    background: var(--color-brand-500);
  }

  /* ==================================================
     Dashboard panels
     ================================================== */

  .dashboard-primary-grid {
    display: grid;
    grid-template-columns:
      minmax(0, 1.05fr)
      minmax(0, 0.95fr);
    gap: var(--space-4);
  }

  .dashboard-panel {
    min-width: 0;
    overflow: hidden;
  }

  .dashboard-panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
    padding: 20px 20px 17px;
    border-bottom: 1px solid var(--color-border);
  }

  .dashboard-panel-header > div {
    display: grid;
    gap: 4px;
  }

  .dashboard-panel-body {
    padding: 18px 20px 20px;
  }

  .dashboard-panel-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    color: var(--color-brand-700);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
    text-decoration: none;
  }

  .dashboard-panel-link:hover {
    color: var(--color-brand-800);
  }

  .dashboard-panel-link svg {
    width: 15px;
    height: 15px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 2;
  }

  .dashboard-table-container {
    border-radius: 10px;
    box-shadow: none;
  }

  .dashboard-table th:last-child,
  .dashboard-table td:last-child {
    text-align: right;
  }

  /* ==================================================
     Recent activity
     ================================================== */

  .dashboard-live-label {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border: 1px solid var(--color-success-border);
    border-radius: var(--radius-pill);
    background: var(--color-success-background);
    color: var(--color-success-text);
    font-size: 10px;
    font-weight: var(--font-weight-extra-bold);
    text-transform: uppercase;
  }

  .dashboard-live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--color-success-text);
  }

  .dashboard-activity-list {
    display: grid;
    max-height: 360px;
    gap: 10px;
    overflow-y: auto;
    padding: 18px 20px 20px;
  }

  .dashboard-activity-list > .card {
    border-radius: var(--radius-medium);
    box-shadow: none;
  }

  .dashboard-activity-list
    > .card
    .card-body {
    padding: 14px;
  }

  .dashboard-activity-loading {
    padding: 16px;
    border: 1px dashed var(--color-border-strong);
    border-radius: var(--radius-medium);
    color: var(--color-text-muted);
    font-size: 13px;
    text-align: center;
  }

  /* ==================================================
     Dashboard lifetime totals
     ================================================== */

  .dashboard-total-grid {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .dashboard-total-card {
    display: grid;
    gap: 6px;
    padding: 18px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .dashboard-total-label {
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
  }

  .dashboard-total-card strong {
    color: var(--color-text-primary);
    font-size: 27px;
    line-height: 1.1;
  }

  .dashboard-total-meta {
    color: var(--color-text-muted);
    font-size: 11px;
  }

  /* ==================================================
     Dashboard responsive behaviour
     ================================================== */

  @media (max-width: 1180px) {
    .dashboard-kpi-grid,
    .dashboard-total-grid {
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
    }
  }

  @media (max-width: 900px) {
    .dashboard-primary-grid {
      grid-template-columns: 1fr;
    }
  }

  @media (max-width: 680px) {
    .dashboard-page {
      gap: 24px;
    }

    .dashboard-hero {
      flex-direction: column;
    }

    .dashboard-hero-actions {
      width: 100%;
    }

    .dashboard-hero-actions .button {
      flex: 1;
    }

    .dashboard-kpi-grid,
    .dashboard-total-grid {
      grid-template-columns: 1fr;
    }

    .dashboard-kpi-card {
      min-height: 165px;
    }

    .dashboard-panel-header {
      flex-direction: column;
    }
  }

    /* ==================================================
     Ideas workspace
     ================================================== */

  .ideas-page {
    gap: 26px;
  }

  /* ==================================================
     Ideas hero
     ================================================== */

  .ideas-hero {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-5);
  }

  .ideas-hero-content {
    display: grid;
    gap: 5px;
  }

  .ideas-hero-eyebrow {
    margin: 0 0 2px;
    color: var(--color-brand-600);
    font-size: 11px;
    font-weight: var(--font-weight-extra-bold);
    letter-spacing: 0.11em;
    text-transform: uppercase;
  }

  .ideas-hero-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
  }

  /* ==================================================
     Generation status
     ================================================== */

  .ideas-status-banner {
    display: flex;
    align-items: center;
    gap: 13px;
    padding: 15px 17px;
    border: 1px solid var(--color-info-border);
    border-radius: var(--radius-medium);
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .ideas-status-banner strong {
    display: block;
    font-size: 13px;
  }

  .ideas-status-banner p {
    margin: 3px 0 0;
    font-size: 12px;
  }

  .ideas-status-spinner {
    width: 20px;
    height: 20px;
    flex: 0 0 20px;
    border: 2px solid var(--color-info-border);
    border-top-color: var(--color-info-text);
    border-radius: 50%;
    animation:
      ideas-spinner-rotation
      750ms
      linear
      infinite;
  }

  @keyframes ideas-spinner-rotation {
    to {
      transform: rotate(360deg);
    }
  }

  /* ==================================================
     Summary cards
     ================================================== */

  .ideas-summary-grid {
    display: grid;
    grid-template-columns:
      repeat(4, minmax(0, 1fr));
    gap: var(--space-4);
  }

  .ideas-summary-card {
    display: flex;
    min-width: 0;
    align-items: center;
    gap: 13px;
    padding: 16px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .ideas-summary-icon {
    display: grid;
    width: 40px;
    height: 40px;
    flex: 0 0 40px;
    place-items: center;
    border-radius: 11px;
  }

  .ideas-summary-icon svg {
    width: 20px;
    height: 20px;
    fill: none;
    stroke: currentColor;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-width: 1.8;
  }

  .ideas-summary-icon-all {
    background: var(--color-warning-background);
    color: var(--color-warning-text);
  }

  .ideas-summary-icon-review {
    background: var(--color-info-background);
    color: var(--color-info-text);
  }

  .ideas-summary-icon-approved {
    background: var(--color-success-background);
    color: var(--color-success-text);
  }

  .ideas-summary-icon-scripts {
    background: #f3efff;
    color: #6542a6;
  }

  .ideas-summary-card > div {
    display: grid;
    min-width: 0;
    gap: 2px;
  }

  .ideas-summary-label {
    overflow: hidden;
    color: var(--color-text-secondary);
    font-size: 12px;
    font-weight: var(--font-weight-bold);
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .ideas-summary-card strong {
    color: var(--color-text-primary);
    font-size: 24px;
    line-height: 1.2;
  }

  /* ==================================================
     Ideas toolbar
     ================================================== */

  .ideas-toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-medium);
    background: var(--color-surface);
    box-shadow: var(--shadow-small);
  }

  .ideas-search {
    display: flex;
    min-width: 220px;
    min-height: 40px;
    flex: 1;
    align-items: center;
    gap: 9px;
    padding: 0 12px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-small);
    background: var(--color-surface-muted);
  }

  .ideas-search svg {
    width: 17px;
    height: 17px;
    flex: 0 0 17px;
