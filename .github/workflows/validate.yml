name: Validate Savannah

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node node-tests/run-local.cjs

  media-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: media-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: media-worker/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
